<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Islandr</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts self-hosted via @font-face in tokens.css (ADR-0010) -->

    <!-- Anti-FOUC: apply theme before first paint. Reads localStorage, falls
         back to OS preference. Must be synchronous and before any CSS paint. -->
    <script>
      (function () {
        var stored = localStorage.getItem("islandr.theme");
        var theme = stored === "dark" || stored === "light"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/app.css" />

    <!--
      Vue + vue-router via importmap. Both self-hosted under /vendor/.
      No build step, no node_modules. See docs/adr/0002-vue-without-npm.md.
    -->
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor/vue.esm-browser.prod.js",
          "vue-router": "/vendor/vue-router.esm-browser.js",
          "@vue/devtools-api": "/vendor/vue-devtools-api-stub.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
