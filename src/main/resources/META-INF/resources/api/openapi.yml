openapi: 3.0.3
info:
  title: Islandr External API
  description: >
    Automation-facing API for scripts, CI, and infrastructure-as-code
    (issue #15). Deliberately separate from the internal `/api/v1` surface
    the Admin Console's own UI uses — that one is free to change shape as
    the UI evolves; this one is a stability-committed contract.


    Authenticated with an API key (Admin Console → API Keys → Create),
    never a session cookie. See ADR-0026 for the full rationale, including
    why this file is hand-written/offline-generated rather than produced by
    a runtime OpenAPI extension.
  version: "1.0.0"
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: /api/external/v1
    description: Path is relative to wherever your Islandr instance is reachable.

security:
  - bearerAuth: []

tags:
  - name: peers
    description: WireGuard peers (client devices and site gateways).
  - name: users
    description: Organisation users.
  - name: sites
    description: Sites (network locations, identified by CIDR).
  - name: resources
    description: Resources reachable through a site (hosts, services).
  - name: roles
    description: Roles used to grant resource access.
  - name: grants
    description: Effective access — who can reach which resource, and how.
  - name: audit
    description: The audit log, read-only.

paths:
  /peers:
    get:
      operationId: listPeers
      summary: List all peers
      tags: [peers]
      responses:
        "200":
          description: Every peer, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Peer"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPeer
      summary: Create a peer
      description: >
        Creates a client peer (pass `userId` as a query parameter) or a
        site gateway peer (omit `userId`, set `type: site` in the body).
        A client peer with no `userId` and no `type: site` is rejected —
        client peers must always have an owner.
      tags: [peers]
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: Required for client peers; omit only when creating a site peer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerCreateRequest"
      responses:
        "201":
          description: Peer created. The response includes the generated key
            material exactly once — it is never retrievable again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerCreateResponse"
        "400":
          description: Validation error (missing userId for a client peer,
            malformed IP/key, IP already assigned, ...).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /peers/{id}/enabled:
    put:
      operationId: setPeerEnabled
      summary: Enable or disable a single peer
      description: >
        Leaves the owning user's account untouched — the granularity a lost or
        replaced device needs, where the person keeps their access and one
        machine loses it.
      tags: [peers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledRequest"
      responses:
        "200":
          description: The peer after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Peer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No peer with that id.

  /users:
    get:
      operationId: listUsers
      summary: List all users
      tags: [users]
      responses:
        "200":
          description: Every user, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/enabled:
    put:
      operationId: setUserEnabled
      summary: Enable or disable a user
      description: >
        Disabling withdraws network access, not just the login: the user's
        peers are switched off with the account. Re-enabling does **not**
        switch them back on — some may have been off for unrelated reasons
        before the account was locked, so letting a device reconnect stays an
        explicit, per-peer action via `/peers/{id}/enabled`.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledRequest"
      responses:
        "200":
          description: The user after the change. Setting the value it already has is a no-op.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No user with that id.

  /sites:
    get:
      operationId: listSites
      summary: List all sites
      tags: [sites]
      responses:
        "200":
          description: Every site.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /resources:
    get:
      operationId: listResources
      summary: List all resources
      tags: [resources]
      responses:
        "200":
          description: Every resource, across all sites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /grants:
    get:
      operationId: listGrants
      summary: Every grant in effect
      description: >
        Who can reach what, resolved the same way the firewall ruleset and the
        self-service portal resolve it — role grants, type grants, network
        grants and direct user or site grants, each as its own row. A user who
        reaches one resource through two paths appears twice, on purpose: an
        access review needs to see both.


        **This returns the installation's complete access picture in a single
        call.** That is a different kind of payload from listing peers. Treat
        the response accordingly, and prefer a short-lived key for a job that
        only reports.


        A `network-grant` row has no `resourceId`: it names a network, and
        covers hosts Islandr may never have been told about.
      tags: [grants]
      responses:
        "200":
          description: Every grant currently in effect.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit:
    get:
      operationId: listAudit
      summary: Read the audit log
      description: >
        Newest first. Page by passing the `createdAt` of the oldest entry you
        received as `before`. `actor` and `action` match exactly — no substring
        search, which would quietly widen what a review returns.


        Read-only by design: the admin API's purge has no counterpart here,
        because an integration that can delete the audit trail is not an audit
        trail.
      tags: [audit]
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Cursor — return entries older than this timestamp (ISO-8601).
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: A page of audit entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "400":
          description: '`before` was not a valid ISO-8601 timestamp.'
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roles:
    get:
      operationId: listRoles
      summary: List all roles
      tags: [roles]
      responses:
        "200":
          description: Every role.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        An API key created in the Admin Console (API Keys page). Sent as
        `Authorization: Bearer islandr_<...>`. Acts with full admin
        privileges in this API version — there is no per-key scoping yet
        (ADR-0026, R-184).

  responses:
    Unauthorized:
      description: Missing, invalid, or revoked API key.

  schemas:
    Peer:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true, description: "null for site peers" }
        name: { type: string }
        publicKey: { type: string }
        assignedIp: { type: string }
        assignedIpv6: { type: string, nullable: true }
        enabled: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        connectionStatus: { type: string, enum: [CONNECTED, STALE, DISCONNECTED] }
        totalRxBytes: { type: integer, format: int64 }
        totalTxBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        type: { type: string, enum: [client, site] }
        siteAllowedCidrs: { type: string, nullable: true }
        deviceType: { type: string, nullable: true }
        hasPresharedKey: { type: boolean }
        validUntil: { type: string, format: date-time, nullable: true }

    Grant:
      type: object
      properties:
        subjectType:
          type: string
          enum: [user, site]
        subjectId:
          type: string
        subjectName:
          type: string
        resourceId:
          type: string
          nullable: true
          description: Null on a network grant, which names a network rather than one resource.
        resourceName:
          type: string
          nullable: true
        siteId:
          type: string
          nullable: true
        siteName:
          type: string
          nullable: true
        kind:
          type: string
          enum: [role, type-grant, network-grant, user-direct, site-direct]
        roleId:
          type: string
          nullable: true
        roleName:
          type: string
          nullable: true
        allPorts:
          type: boolean
        ports:
          type: array
          items:
            type: string
          description: >
            Human-readable labels for the ports a limited grant is scoped to,
            empty when allPorts is true. A rendering, not data — "SSH 22" is the
            console's application label and the number, and it carries no
            transport. Do not parse it; read portDetails instead.
        portDetails:
          type: array
          description: >
            The same ports as values, for building a rule from. Empty when
            allPorts is true, in which case the grant covers every port on the
            resource.
          items:
            $ref: "#/components/schemas/PortDetail"

    PortDetail:
      type: object
      properties:
        id:
          type: string
          description: The ResourcePort id, stable across calls.
        port:
          type: integer
          description: Single port, or the start of a range. 0 means every port.
        portEnd:
          type: integer
          nullable: true
          description: End of the range, inclusive. Null for a single port.
        transport:
          type: string
          enum: [tcp, udp, both]
          description: >
            The transport to filter on. This is the field that does not appear
            in the `ports` labels at all, and the one a firewall rule cannot be
            written without.
        protocol:
          type: string
          description: >
            The console's application label (RDP, SSH, SFTP, HTTP, CUSTOM). It
            describes what speaks on the port, not how — never read it as the
            transport.
        label:
          type: string
          nullable: true
          description: Optional free-text name an admin gave this port.

    AuditEntry:
      type: object
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        meta:
          type: string
          description: Raw JSON string, shape depends on the action.
        createdAt:
          type: string
          format: date-time

    EnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          description: >
            Optional free-text context for the audit log (peers only). Never
            stored on the peer itself.
      example:
        enabled: false
        reason: offboarded

    PeerCreateRequest:
      type: object
      required: [name, assignedIp]
      properties:
        name: { type: string }
        assignedIp:
          type: string
          description: Must fall inside the instance's configured WireGuard subnet.
        assignedIpv6: { type: string, nullable: true }
        publicKey:
          type: string
          nullable: true
          description: >
            Omit both publicKey and privateKey to have Islandr generate a
            fresh keypair (the common case). Set publicKey only to import a
            client-generated key. Set both to import an existing keypair
            (e.g. migrating from another WireGuard setup).
        privateKey: { type: string, nullable: true }
        type: { type: string, enum: [client, site], default: client }
        siteAllowedCidrs:
          type: string
          nullable: true
          description: Comma-separated CIDR list. Required when type=site.
        deviceType:
          type: string
          nullable: true
          enum: [laptop, desktop, mobile, tablet, server, other]
        mtu: { type: integer, nullable: true, minimum: 576, maximum: 65535 }
        generatePresharedKey: { type: boolean, default: false }

    PeerCreateResponse:
      type: object
      properties:
        peer:
          $ref: "#/components/schemas/Peer"
        privateKey:
          type: string
          nullable: true
          description: Present only when Islandr generated or was given the private key.
        conf:
          type: string
          description: A ready-to-use WireGuard .conf file, as text.
        qrPngBase64:
          type: string
          description: The .conf rendered as a QR code, base64-encoded PNG.
        presharedKey: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        nickname: { type: string, nullable: true }
        displayName: { type: string, description: "nickname if set, else name" }
        email: { type: string }
        enabled: { type: boolean }
        isAdmin: { type: boolean }
        preferredLocale: { type: string, nullable: true, enum: [de, en] }
        peerCount: { type: integer }
        # Access deadline (issue #53). Null means no expiry, which is the
        # default. Once it passes the user cannot log in and their devices are
        # switched off; accessExpired is that comparison, already made.
        validUntil: { type: string, format: date-time, nullable: true }
        accessExpired: { type: boolean }
        createdAt: { type: string, format: date-time }

    Site:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        cidr: { type: string }
        description: { type: string, nullable: true }
        resourceCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        gatewayPeerId: { type: string, nullable: true }
        gatewayPeerName: { type: string, nullable: true }
        gatewayOnline: { type: boolean, nullable: true, description: "null when no gateway is configured" }
        outsideSplitSupernet: { type: boolean, nullable: true }
        subdomain: { type: string, nullable: true }
        dnsServerIp: { type: string, nullable: true }

    Resource:
      type: object
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string }
        ip: { type: string }
        description: { type: string, nullable: true }
        type: { type: string, enum: [computer, router, printer, nas, camera, iot, virt-host, rackserver, kvm, management, other] }
        dnsName: { type: string, nullable: true }
        dnsFlat: { type: boolean }
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ResourcePort"
        createdAt: { type: string, format: date-time }

    ResourcePort:
      type: object
      properties:
        id: { type: string }
        port: { type: integer }
        portEnd: { type: integer, nullable: true }
        # Exclusive-capacity config (issue #72). maxConcurrentUsers null means
        # unlimited — the port is reachable on a grant alone, which is the
        # default and the behaviour of every port created before #72. With a
        # value set, users must additionally hold a reservation on this port;
        # other ports of the same resource are unaffected.
        maxConcurrentUsers: { type: integer, nullable: true }
        maxReservationMinutes: { type: integer, nullable: true }
        autoApproveReservations: { type: boolean }
        transport: { type: string }
        protocol: { type: string, nullable: true }
        label: { type: string, nullable: true }
        pathPrefix: { type: string, nullable: true }
        rdpClipboard: { type: boolean }
        rdpFileTransfer: { type: boolean }
        rdpAccessMode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount: { type: integer }
        grantCount: { type: integer }
        autoAll: { type: boolean, description: "true for the seeded 'Everyone' role (ADR-0013)" }
        createdAt: { type: string, format: date-time }
