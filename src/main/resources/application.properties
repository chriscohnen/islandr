# Islandr — backend config
# ---------------------------------------------------------------------------
# Dev profile (default): SQLite file at ./data/islandr.db
# Prod team profile: Postgres, configured via env vars (see %prod section)
# See docs/adr/0004-sqlite-dev-postgres-prod.md for the dual-backend rationale.

quarkus.application.name=islandr
quarkus.http.port=8080

# Built-in TLS termination (ADR-0015, issue #22). HTTPS listens alongside plain
# HTTP — insecure-requests stays "enabled" so both ports serve, matching how a
# reverse proxy would front the app during migration to the built-in listener.
# No quarkus.tls.* static config: TlsKeyStoreProvider (de.chriscohnen.islandr.tls)
# is the sole source of the default TLS configuration's certificate material —
# the dummy placeholder cert until an admin uploads real material via Settings.
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=enabled
# GraalVM bundles no classpath resources into a native image by default — only
# what it can prove is referenced. TlsKeyStoreProvider reads the dummy cert/key
# via a dynamic Class#getResourceAsStream(path) call, which native-image's static
# analysis cannot follow, so the files must be registered explicitly or the
# native binary throws FileNotFound the moment it needs the dummy certificate
# (i.e. immediately at boot, before any real certificate is configured).
quarkus.native.resources.includes=tls-dummy/*.pem

# Trust X-Forwarded-Proto/Host headers from reverse proxies (Traefik, Caddy, nginx).
# Required so OIDC redirect URIs are built with the correct scheme and hostname
# instead of http://127.0.0.1:8080.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# Front-end cache-busting without a bundler: the app ships no content-hashed
# filenames (Vue from CDN, self-hosted JS + CSS), so instead of long-lived caching
# we tell the browser to revalidate the app code, styles and the SPA entry point on
# every load. The static handler's ETag makes an unchanged asset a cheap 304, so a
# new release is picked up immediately without a manual hard-refresh. /vendor (stable
# third-party libs) keeps its default caching.
quarkus.http.filter.app-assets.matches=(/js/.*)|(/css/.*)|/|(/index\\.html)
quarkus.http.filter.app-assets.header."Cache-Control"=no-cache
quarkus.http.filter.app-assets.methods=GET,HEAD

# ---------------------------------------------------------------------------
# WireGuard adapter mode
#   mock   — in-memory, no real wg interaction (dev/macOS/CI only)
#   real   — shells out to `wg` CLI; needs a live kernel interface on Linux
#   socket — talks to the host-side islandr-proxy over a Unix socket (ADR-0012)
#
# Deliberately UNSET outside dev/test. AdapterMode.resolve() then falls back to
# `socket` inside a container and `mock` on a bare host. A value set here without
# a profile prefix applies to every profile, counts as "explicit", and wins over
# that container default — the published image would run the success-faking mock
# instead of the real socket adapter in its degraded "enforcement unavailable"
# state, hiding from the operator that nothing is enforced on the host kernel
# (ADR-0012, risk R-122). AdapterModeDefaultsConfigTest locks this in.
#
# Hub VM in production (native binary, no container) sets: ISLANDR_WG_MODE=real
# ---------------------------------------------------------------------------
%dev.islandr.wg.mode=mock
%test.islandr.wg.mode=mock

# nftables adapter: same rule — mock in dev/test, container defaults to socket,
# bare-host production sets ISLANDR_NFT_MODE=real.
%dev.islandr.nft.mode=mock
%test.islandr.nft.mode=mock

# Device discovery (ADR-0014): unlike wg/nft, this one defaults to "real" —
# it's an unprivileged unicast TCP/UDP scan (no sudo, no enforcement-path
# involvement), so a production install needs zero extra config to get a
# working scan. Dev/test pin it back to mock (two fixed synthetic hosts)
# so a laptop or CI run never fires TCP connects at a real subnet.
%dev.islandr.discovery.mode=mock
%test.islandr.discovery.mode=mock

# Boot-time nftables sync. Test profile turns it off so tests start with a
# pristine FirewallState row (last_status='never'). Production leaves it on.
%test.islandr.firewall.boot-apply=false

# Privilege model for the real adapters. false = the JVM already has the
# capabilities it needs (e.g. systemd AmbientCapabilities=CAP_NET_ADMIN).
# true = prefix every privileged `nft` / `wg set` / `wg show` invocation with
# `sudo`. Set via ISLANDR_USE_SUDO=true when the operator prefers a sudoers
# entry over a capability grant. See docs/install.md §1 Option B.
islandr.use-sudo=false

# ---------------------------------------------------------------------------
# Socket proxy (islandr.wg.mode=socket / islandr.nft.mode=socket): the
# unprivileged container talks to a host-side islandr-proxy over a Unix socket
# (ADR-0012). These values are inert unless socket mode is selected, which only
# the production container image does. On a bare host the adapters stay
# mock/real, so enforcement never goes through the proxy.
# ---------------------------------------------------------------------------
islandr.proxy.socket=/run/islandr/proxy.sock
islandr.proxy.ruleset-path=/var/lib/islandr/ruleset.nft
islandr.proxy.timeout=2s
# Reconcile-on-connect cadence. Tests drive the reconciler explicitly, so the
# schedule is pushed far out to avoid any background firing during a test run.
islandr.proxy.reconcile-interval=10s
%test.islandr.proxy.reconcile-interval=9999s

# Activity poller: samples wg show every 30s to populate peer.lastSeenAt.
# Tests turn it off so the dashboard view stays deterministic.
islandr.activity.poll-enabled=true
%test.islandr.activity.poll-enabled=false

# Peer-Scheduler (#47): minute-tick job that flips Peer.enabled based on
# PeerSchedule/validUntil. Tests invoke the job's logic directly rather than
# waiting on the timer, same reasoning as the activity poller above.
islandr.peer-schedule.enabled=true
%test.islandr.peer-schedule.enabled=false

# WgBootstrap: probes the wg interface once at startup (real/mock mode only —
# socket mode's equivalent is ProxyReconciler) and logs a clear WARN with the
# real reason if it's not reachable, so a broken WireGuard install doesn't
# silently show up only as a DEBUG-level line from the activity poller (#37).
islandr.wg.boot-probe-enabled=true
%test.islandr.wg.boot-probe-enabled=false

# ---------------------------------------------------------------------------
# WireGuard kernel interface name. Bootstrap-only — set in the systemd unit /
# docker-compose, not editable at runtime. All other wg topology settings
# (subnet, server pubkey, endpoint, allowed-ips, dns, retention policy)
# live in the `settings` table and are edited via the Admin Console.
# See docs/adr/0008-runtime-settings-in-db.md.
# ---------------------------------------------------------------------------
islandr.wg.interface=wg0

# ---------------------------------------------------------------------------
# Resource-name DNS resolver (ADR-0023, opt-in via Settings.dnsResolverEnabled —
# off by default, this only sets the bind port for when it's on). 53 is the
# standard port but is privileged; binding it as the unprivileged islandr
# process (ADR-0011) needs CAP_NET_BIND_SERVICE granted separately (systemd:
# AmbientCapabilities=CAP_NET_BIND_SERVICE) — not part of ADR-0011's sudoers
# scope. A bind failure is logged with the fix and leaves the resolver off;
# it never crashes the app.
# ---------------------------------------------------------------------------
islandr.dns.port=53
# Dev profile runs as your own unprivileged shell user (quarkus dev), same
# CAP_NET_BIND_SERVICE gap as prod — but there's no systemd unit to grant it
# to locally, and macOS has no setcap equivalent at all. Use an unprivileged
# port for local testing instead of fighting that; test with e.g.
# `dig @<bindAddress> -p 5353 name.site.islandr.internal`.
%dev.islandr.dns.port=5353

# ---------------------------------------------------------------------------
# ACME (ADR-0019). v1 ships Let's Encrypt only — the directory URL is a fixed
# default, overridable only to point at Let's Encrypt's staging environment
# for testing (unlimited, non-trust-chained issuance), not a per-instance
# Settings field (multi-CA/EAB is deferred, see the ADR). renewal-window-days
# is how far ahead of expiry the scheduler renews; poll-* bound how long one
# issuance attempt waits on Let's Encrypt's own validation/issuance latency
# before giving up (surfaced as acmeLastError, retried on the next schedule).
# ---------------------------------------------------------------------------
islandr.acme.directory-url=https://acme-v02.api.letsencrypt.org/directory
islandr.acme.renewal-window-days=30
islandr.acme.poll-interval=2s
islandr.acme.poll-timeout=60s
islandr.acme.renewal-check-interval=24h
# dns-01/Cloudflare only (ADR-0020) -- fixed wait after publishing the TXT
# record before notifying the ACME server, instead of actively polling DNS.
islandr.acme.dns-propagation-wait=30s
%test.islandr.acme.renewal-check-interval=9999s
%test.islandr.acme.directory-url=https://acme-test.example/directory
%test.islandr.acme.poll-interval=1ms
%test.islandr.acme.poll-timeout=3s
%test.islandr.acme.dns-propagation-wait=1ms

# ---------------------------------------------------------------------------
# Datasource — SQLite for dev and small self-host prod
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/islandr.db
quarkus.datasource.username=islandr
# SQLite has FK support but it's OFF by default per connection. ON CASCADE in
# our migrations only fires when foreign_keys=ON. Set it via the JDBC-level
# init SQL so every pooled connection enforces FKs from the first query.
quarkus.datasource.jdbc.new-connection-sql=PRAGMA foreign_keys = ON

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# Flyway runs migrations against the configured datasource
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Local admin (bootstrap, ENV-driven)
# ---------------------------------------------------------------------------
# islandr.admin.user defaults to 'admin'. islandr.admin.password has no default
# in prod — operators must set ISLANDR_ADMIN_PASSWORD as an env var to enable
# the local admin login (otherwise /api/v1/auth/login returns 503). See
# AdminBootstrap. We do ship dev/test defaults so the local dev loop just works:
%dev.islandr.admin.user=admin
%dev.islandr.admin.password=admin
%test.islandr.admin.user=admin
%test.islandr.admin.password=test-admin-pw

# ---------------------------------------------------------------------------
# Test profile — in-memory SQLite, fresh DB per run
# ---------------------------------------------------------------------------
# The 'file::memory:?cache=shared' form (vs plain ':memory:') lets every
# JDBC connection in the Agroal pool see the same in-memory DB. With the
# plain form each new connection gets its own private DB, which means
# Flyway's tables vanish the moment a different worker thread takes the
# next request — surfaces as 'no such table: sessions' on /auth/login.
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:file::memory:?cache=shared
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.hibernate-orm.log.sql=true
# Test-only AES-256 key — 32 zero bytes in base64. Never use a zero key in production.
%test.islandr.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# ---------------------------------------------------------------------------
# Encryption key for `encrypted` private key retention mode (ADR-0007).
# Primary: file path delivered by systemd-creds (see docs/adr/0007-private-key-retention.md).
#   The systemd unit sets: LoadCredentialEncrypted=ENCRYPTION_KEY:/etc/islandr/kek.cred
#   Islandr reads the decrypted key from /run/credentials/islandr.service/ENCRYPTION_KEY
# Fallback for Docker / dev: env var ISLANDR_ENCRYPTION_KEY (base64-encoded 32 bytes).
# Not set → only `never` and `plaintext` retention modes are available.
# Declared here with empty default so Quarkus native image does not treat it as required.
islandr.encryption.key=
# islandr.encryption.key-path=/run/credentials/islandr.service/ENCRYPTION_KEY
# ---------------------------------------------------------------------------
# Prod profile — switch to Postgres via env (QUARKUS_DATASOURCE_*) at runtime.
# Defaults here keep SQLite so the single binary works without env vars.
# Operators with Postgres set:
#   QUARKUS_DATASOURCE_DB_KIND=postgresql
#   QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://...
#   QUARKUS_DATASOURCE_USERNAME=...
#   QUARKUS_DATASOURCE_PASSWORD=...
#   QUARKUS_HIBERNATE_ORM_DIALECT=org.hibernate.dialect.PostgreSQLDialect
# ---------------------------------------------------------------------------
