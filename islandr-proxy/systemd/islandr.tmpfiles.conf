# Installed to /etc/tmpfiles.d/islandr.conf
# Creates the runtime dir before sockets.target, so islandr-proxy.socket can bind
# /run/islandr/proxy.sock and the daemon can write short-lived preshared-key files.
# Owned by islandr:islandr, mode 0700 — not world-accessible.
d /run/islandr 0700 islandr islandr -
