name: Secret scan

# Automatic triggers suspended to preserve GitHub Actions minutes.
# Restore by replacing this block with the original on: push/pull_request triggers.
on:
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
