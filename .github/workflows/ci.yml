name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Stage 1: Tests (JVM, fast) ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: ./gradlew test jacocoTestReport --no-daemon
        # No datasource env vars — the %test profile in application.properties
        # uses jdbc:sqlite:file::memory:?cache=shared which works without
        # any external DB or additional driver.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Stage 2a: Native build amd64 (main + tags) ────────────────────────────
  native-amd64:
    name: Native build (amd64)
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native binary (SQLite-only, container build)
        run: |
          ./gradlew buildNative -Psqlite \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            --no-daemon

      - name: Compress binary with UPX (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get install -y upx-ucl
          BINARY=$(ls build/islandr-*-runner)
          upx -7 "$BINARY"

      - name: Locate binary and compute checksum
        id: artifact
        run: |
          BINARY=$(ls build/islandr-*-runner)
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          sha256sum "$BINARY" | tee build/islandr-runner.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: |
            ${{ steps.artifact.outputs.binary }}
            build/islandr-runner.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 2b: Native build arm64 (tags only — saves ~15 min per push) ─────
  native-arm64:
    name: Native build (arm64)
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native binary (SQLite-only, container build)
        run: |
          ./gradlew buildNative -Psqlite \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            --no-daemon

      - name: Compress binary with UPX
        run: |
          sudo apt-get install -y upx-ucl
          BINARY=$(ls build/islandr-*-runner)
          upx -7 "$BINARY"

      - name: Locate binary and compute checksum
        id: artifact
        run: |
          BINARY=$(ls build/islandr-*-runner)
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          sha256sum "$BINARY" | tee build/islandr-runner.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: |
            ${{ steps.artifact.outputs.binary }}
            build/islandr-runner.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 3: Release (tags only) ──────────────────────────────────────────
  release:
    name: Release
    needs: [native-amd64, native-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: dist/amd64/

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: dist/arm64/

      - name: Prepare release assets
        run: |
          for arch in amd64 arm64; do
            BINARY=$(ls dist/$arch/islandr-*-runner)
            mv "$BINARY" dist/islandr-runner-linux-$arch
            sha256sum dist/islandr-runner-linux-$arch > dist/islandr-runner-linux-$arch.sha256
            chmod +x dist/islandr-runner-linux-$arch
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/islandr-runner-linux-amd64
            dist/islandr-runner-linux-amd64.sha256
            dist/islandr-runner-linux-arm64
            dist/islandr-runner-linux-arm64.sha256

  # ── Stage 4: Docker multi-arch image (tags only) ──────────────────────────
  docker:
    name: Docker image
    needs: [native-amd64, native-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: dist/amd64/

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: dist/arm64/

      - name: Rename binaries to fixed name for Docker COPY
        run: |
          mv dist/amd64/islandr-*-runner dist/amd64/islandr-runner
          mv dist/arm64/islandr-*-runner dist/arm64/islandr-runner
          chmod +x dist/amd64/islandr-runner dist/arm64/islandr-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
