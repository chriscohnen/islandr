name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Stage 1: Tests (JVM, fast) ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: ./gradlew test jacocoTestReport --no-daemon
        # No datasource env vars — the %test profile in application.properties
        # uses jdbc:sqlite:file::memory:?cache=shared which works without
        # any external DB or additional driver.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Stage 2a: Native build amd64 (main + tags) ────────────────────────────
  native-amd64:
    name: Native build (amd64)
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native binary (SQLite-only, container build)
        run: |
          ./gradlew buildNative -Psqlite \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            --no-daemon

      - name: Compress binary with UPX (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get install -y upx-ucl
          BINARY=$(ls build/islandr-*-runner)
          upx -7 "$BINARY"

      - name: Locate binary and compute checksum
        id: artifact
        run: |
          BINARY=$(ls build/islandr-*-runner)
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          sha256sum "$BINARY" | tee build/islandr-runner.sha256

      # Boots the actual native binary (the artifact we ship) and drives peer
      # creation end-to-end, asserting a QR PNG comes back. This guards the
      # JVM↔native gap: QR encoding works on the JVM but broke in the native
      # image when it depended on AWT/ImageIO (FROM scratch has neither). JVM
      # unit tests can't see that — only running the native binary can.
      - name: Native smoke test (boot binary, create peer, assert QR)
        run: |
          set -euo pipefail
          BINARY="${{ steps.artifact.outputs.binary }}"
          chmod +x "$BINARY"

          # Run with the prod profile (as deployed): local admin via env, a
          # throwaway SQLite DB, default mock wg/nft adapters.
          ISLANDR_ADMIN_PASSWORD=ci-smoke-pw \
          QUARKUS_HTTP_PORT=8081 \
          QUARKUS_DATASOURCE_JDBC_URL="jdbc:sqlite:/tmp/islandr-smoke.db" \
          "$BINARY" > /tmp/islandr-smoke.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT

          # Wait until the HTTP port answers (401 from an authed endpoint = up).
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/peers/next-ip || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          [ "$code" != "000" ] || { echo "::error::native binary did not start"; cat /tmp/islandr-smoke.log; exit 1; }

          login=$(curl -s -c /tmp/cj.txt -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8081/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-pw"}')
          [ "$login" = "200" ] || { echo "::error::admin login failed (HTTP $login)"; cat /tmp/islandr-smoke.log; exit 1; }

          USER_ID=$(curl -s -b /tmp/cj.txt -X POST http://localhost:8081/api/v1/users \
            -H 'content-type: application/json' \
            -d '{"name":"Smoke","email":"smoke@example.com"}' | jq -r .id)
          IP=$(curl -s -b /tmp/cj.txt http://localhost:8081/api/v1/peers/next-ip | jq -r .assignedIp)
          [ -n "$USER_ID" ] && [ "$USER_ID" != "null" ] || { echo "::error::could not create user"; cat /tmp/islandr-smoke.log; exit 1; }
          echo "created user=$USER_ID, next ip=$IP"

          QR=$(curl -s -b /tmp/cj.txt -X POST "http://localhost:8081/api/v1/users/$USER_ID/peers" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"smoke-device\",\"assignedIp\":\"$IP\"}" | jq -r .qrPngBase64)

          if [[ "$QR" == data:image/png* ]]; then
            echo "✓ native binary returned a QR PNG"
          else
            echo "::error::QR generation failed in the native binary (AWT/ImageIO regression). Got: ${QR:0:40}"
            cat /tmp/islandr-smoke.log
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: |
            ${{ steps.artifact.outputs.binary }}
            build/islandr-runner.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 2b: Native build arm64 (tags only — saves ~15 min per push) ─────
  native-arm64:
    name: Native build (arm64)
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native binary (SQLite-only, container build)
        run: |
          ./gradlew buildNative -Psqlite \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            --no-daemon

      - name: Compress binary with UPX
        run: |
          sudo apt-get install -y upx-ucl
          BINARY=$(ls build/islandr-*-runner)
          upx -7 "$BINARY"

      - name: Locate binary and compute checksum
        id: artifact
        run: |
          BINARY=$(ls build/islandr-*-runner)
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          sha256sum "$BINARY" | tee build/islandr-runner.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: |
            ${{ steps.artifact.outputs.binary }}
            build/islandr-runner.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 3: Release (tags only) ──────────────────────────────────────────
  release:
    name: Release
    needs: [native-amd64, native-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: dist/amd64/

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: dist/arm64/

      - name: Prepare release assets
        run: |
          for arch in amd64 arm64; do
            BINARY=$(ls dist/$arch/islandr-*-runner)
            mv "$BINARY" dist/islandr-runner-linux-$arch
            sha256sum dist/islandr-runner-linux-$arch > dist/islandr-runner-linux-$arch.sha256
            chmod +x dist/islandr-runner-linux-$arch
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: |
            dist/islandr-runner-linux-amd64
            dist/islandr-runner-linux-amd64.sha256
            dist/islandr-runner-linux-arm64
            dist/islandr-runner-linux-arm64.sha256

  # ── Stage 4: Docker multi-arch image (tags only) ──────────────────────────
  docker:
    name: Docker image
    needs: [native-amd64, native-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: dist/amd64/

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: dist/arm64/

      - name: Rename binaries to fixed name for Docker COPY
        run: |
          mv dist/amd64/islandr-*-runner dist/amd64/islandr-runner
          mv dist/arm64/islandr-*-runner dist/arm64/islandr-runner
          chmod +x dist/amd64/islandr-runner dist/arm64/islandr-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
