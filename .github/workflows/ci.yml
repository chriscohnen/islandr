name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Stage 1: Tests (JVM, fast) ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The frontend has no build step (ADR-0002), so a broken inline template
      # is only discovered when a user opens the page. Uses the runner's
      # preinstalled Node and the Vue build already vendored in the repo —
      # nothing is installed, so this adds no dependency to attack.
      # The wrapper fetches the Gradle distribution from services.gradle.org on
      # any cache miss, and a miss is guaranteed on every release: Actions caches
      # are branch-scoped, so main cannot read the release branch's caches and its
      # own expired long ago (main is only pushed to at release time). A transient
      # reset on that download failed the 0.20.0 build on main while the tag build
      # of the identical commit succeeded. Fetch it once, with retries, before any
      # step depends on it.
      - name: Warm the Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "::warning::gradle distribution fetch failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::could not fetch the Gradle distribution after 3 attempts"
          exit 1

      - name: Check Vue templates
        run: node scripts/check-templates.mjs

      - name: Run tests
        run: ./gradlew test jacocoTestReport --no-daemon
        # No datasource env vars — the %test profile in application.properties
        # uses jdbc:sqlite:file::memory:?cache=shared which works without
        # any external DB or additional driver.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Stage 2a: Native build amd64 (main + tags) ────────────────────────────
  native-amd64:
    name: Native build (amd64)
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # testNative builds the binary (same quarkusBuild as buildNative would) and
      # then runs src/native-test/java against it — e.g. DiscoveryNativeIT, which
      # guards native-image serialization regressions JVM @QuarkusTest cannot see
      # (issue #25). One invocation; no separate native build.
      # The wrapper fetches the Gradle distribution from services.gradle.org on
      # any cache miss, and a miss is guaranteed on every release: Actions caches
      # are branch-scoped, so main cannot read the release branch's caches and its
      # own expired long ago (main is only pushed to at release time). A transient
      # reset on that download failed the 0.20.0 build on main while the tag build
      # of the identical commit succeeded. Fetch it once, with retries, before any
      # step depends on it.
      - name: Warm the Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "::warning::gradle distribution fetch failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::could not fetch the Gradle distribution after 3 attempts"
          exit 1

      - name: Build native binary + run native integration tests (SQLite-only, container build)
        run: |
          ./gradlew testNative -Psqlite \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            -Dquarkus.native.additional-build-args=-march=compatibility \
            --no-daemon

      - name: Compress binary with UPX (release tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get install -y upx-ucl
          BINARY=$(ls build/islandr-*-runner)
          upx -7 "$BINARY"

      - name: Locate binary and compute checksum
        id: artifact
        run: |
          BINARY=$(ls build/islandr-*-runner)
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          sha256sum "$BINARY" | tee build/islandr-runner.sha256

      # Boots the actual native binary (the artifact we ship) and drives peer
      # creation end-to-end, asserting a QR PNG comes back. This guards the
      # JVM↔native gap: QR encoding works on the JVM but broke in the native
      # image when it depended on AWT/ImageIO (FROM scratch has neither). JVM
      # unit tests can't see that — only running the native binary can.
      - name: Native smoke test (boot binary, create peer, assert QR)
        run: |
          set -euo pipefail
          BINARY="${{ steps.artifact.outputs.binary }}"
          chmod +x "$BINARY"

          # Run with the prod profile (as deployed): local admin via env, a
          # throwaway SQLite DB, default mock wg/nft adapters.
          ISLANDR_ADMIN_PASSWORD=ci-smoke-pw \
          QUARKUS_HTTP_PORT=8081 \
          QUARKUS_DATASOURCE_JDBC_URL="jdbc:sqlite:/tmp/islandr-smoke.db" \
          "$BINARY" > /tmp/islandr-smoke.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT

          # Wait until the HTTP port answers (401 from an authed endpoint = up).
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/peers/next-ip || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          [ "$code" != "000" ] || { echo "::error::native binary did not start"; cat /tmp/islandr-smoke.log; exit 1; }

          login=$(curl -s -c /tmp/cj.txt -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8081/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-pw"}')
          [ "$login" = "200" ] || { echo "::error::admin login failed (HTTP $login)"; cat /tmp/islandr-smoke.log; exit 1; }

          USER_ID=$(curl -s -b /tmp/cj.txt -X POST http://localhost:8081/api/v1/users \
            -H 'content-type: application/json' \
            -d '{"name":"Smoke","email":"smoke@example.com"}' | jq -r .id)
          IP=$(curl -s -b /tmp/cj.txt http://localhost:8081/api/v1/peers/next-ip | jq -r .assignedIp)
          [ -n "$USER_ID" ] && [ "$USER_ID" != "null" ] || { echo "::error::could not create user"; cat /tmp/islandr-smoke.log; exit 1; }
          echo "created user=$USER_ID, next ip=$IP"

          QR=$(curl -s -b /tmp/cj.txt -X POST "http://localhost:8081/api/v1/users/$USER_ID/peers" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"smoke-device\",\"assignedIp\":\"$IP\"}" | jq -r .qrPngBase64)

          if [[ "$QR" == data:image/png* ]]; then
            echo "✓ native binary returned a QR PNG"
          else
            echo "::error::QR generation failed in the native binary (AWT/ImageIO regression). Got: ${QR:0:40}"
            cat /tmp/islandr-smoke.log
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: |
            ${{ steps.artifact.outputs.binary }}
            build/islandr-runner.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 2b: Native build arm64 (tags only — saves ~15 min per push) ─────
  native-arm64:
    name: Native build (arm64)
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The wrapper fetches the Gradle distribution from services.gradle.org on
      # any cache miss, and a miss is guaranteed on every release: Actions caches
      # are branch-scoped, so main cannot read the release branch's caches and its
      # own expired long ago (main is only pushed to at release time). A transient
      # reset on that download failed the 0.20.0 build on main while the tag build
      # of the identical commit succeeded. Fetch it once, with retries, before any
      # step depends on it.
      - name: Warm the Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "::warning::gradle distribution fetch failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::could not fetch the Gradle distribution after 3 attempts"
          exit 1

      - name: Build native binary (SQLite-only, container build)
        run: |
          ./gradlew buildNative -Psqlite \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            -Dquarkus.native.additional-build-args=-march=compatibility \
            --no-daemon

      - name: Compress binary with UPX
        run: |
          sudo apt-get install -y upx-ucl
          BINARY=$(ls build/islandr-*-runner)
          upx -7 "$BINARY"

      - name: Locate binary and compute checksum
        id: artifact
        run: |
          BINARY=$(ls build/islandr-*-runner)
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          sha256sum "$BINARY" | tee build/islandr-runner.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: |
            ${{ steps.artifact.outputs.binary }}
            build/islandr-runner.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 2c: islandr-proxy Go binary (main + tags; Go cross-compiles both arches) ──
  proxy:
    name: Build islandr-proxy
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false # zero third-party deps → no go.sum to cache

      - name: Vet + test
        working-directory: islandr-proxy
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile (amd64 + arm64) + checksums
        working-directory: islandr-proxy
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/dist/islandr-proxy-linux-$arch" .
          done
          cp install-proxy.sh "$GITHUB_WORKSPACE/dist/install-proxy.sh"
          cd "$GITHUB_WORKSPACE/dist"
          for arch in amd64 arm64; do
            sha256sum "islandr-proxy-linux-$arch" > "islandr-proxy-linux-$arch.sha256"
          done

      - name: Upload islandr-proxy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: islandr-proxy
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ── Stage 3: Release (tags only) ──────────────────────────────────────────
  release:
    name: Release
    needs: [native-amd64, native-arm64, proxy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # Build provenance: id-token mints the short-lived OIDC identity this
      # workflow signs with, attestations stores the result. No key material
      # anywhere — a signing key kept as a repository secret would live in the
      # same place it is meant to prove something against.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: dist/amd64/

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: dist/arm64/

      - name: Download islandr-proxy artifacts
        uses: actions/download-artifact@v4
        with:
          name: islandr-proxy
          path: dist/proxy/

      - name: Prepare release assets
        run: |
          for arch in amd64 arm64; do
            BINARY=$(ls dist/$arch/islandr-*-runner)
            mv "$BINARY" dist/islandr-runner-linux-$arch
            # Bare basename, no dist/ prefix — consumers download the asset next to
            # the checksum file and run `sha256sum -c` in their own directory.
            (cd dist && sha256sum "islandr-runner-linux-$arch" > "islandr-runner-linux-$arch.sha256")
            chmod +x dist/islandr-runner-linux-$arch
          done

      # A checksum published beside its binary proves the download was not
      # corrupted, not that the release is the one this repository built:
      # whoever could replace the binary could replace the .sha256 with it.
      # The attestation binds each file to the workflow, the commit and the
      # run that produced it, and it is verified against GitHub rather than
      # against us:
      #   gh attestation verify ./islandr-runner-linux-amd64 --repo chriscohnen/islandr
      # Final releases only. A candidate is superseded within days and then
      # deleted, and an attestation outlives the artifact it describes — it is
      # keyed by digest, not by tag, so it cannot be cleaned up with the
      # release. Attesting every RC would leave a growing set of records for
      # binaries nobody can download any more.
      - name: Attest build provenance
        if: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/islandr-runner-linux-amd64
            dist/islandr-runner-linux-arm64
            dist/proxy/islandr-proxy-linux-amd64
            dist/proxy/islandr-proxy-linux-arm64

      # The curated, operator-facing notes live in CHANGELOG.md — write them once
      # there and ship them as the release body. generate_release_notes still
      # appends the raw commit/PR list underneath. An RC tag (v0.12.0-rc.1) uses
      # the section of its target version (## 0.12.0); if no section exists yet,
      # the body stays empty and only the generated notes are published.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"     # v0.12.0-rc.1 → 0.12.0-rc.1
          VERSION="${VERSION%%-*}"           #              → 0.12.0
          awk -v ver="## $VERSION" '
            $0 == ver { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "::notice::Release body taken from CHANGELOG.md section '$VERSION'"
          else
            echo "::warning::No '## $VERSION' section in CHANGELOG.md — publishing generated notes only"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: |
            dist/islandr-runner-linux-amd64
            dist/islandr-runner-linux-amd64.sha256
            dist/islandr-runner-linux-arm64
            dist/islandr-runner-linux-arm64.sha256
            dist/proxy/islandr-proxy-linux-amd64
            dist/proxy/islandr-proxy-linux-amd64.sha256
            dist/proxy/islandr-proxy-linux-arm64
            dist/proxy/islandr-proxy-linux-arm64.sha256
            dist/proxy/install-proxy.sh
            scripts/update.sh
            scripts/backup.sh

  # ── Stage 4: Docker multi-arch image (tags only) ──────────────────────────
  docker:
    name: Docker image
    needs: [native-amd64, native-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-amd64
          path: dist/amd64/

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: islandr-runner-linux-arm64
          path: dist/arm64/

      - name: Rename binaries to fixed name for Docker COPY
        run: |
          mv dist/amd64/islandr-*-runner dist/amd64/islandr-runner
          mv dist/arm64/islandr-*-runner dist/arm64/islandr-runner
          chmod +x dist/amd64/islandr-runner dist/arm64/islandr-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image locally (for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: islandr:smoke

      # Runs the ACTUAL image (not the raw binary on the runner, like the
      # native-* smoke does) and drives the API end-to-end. This guards the
      # native↔container gap: a runtime base that cannot execute the
      # glibc-dynamic native binary (e.g. FROM scratch, or a base missing libz)
      # makes the container exit 127 with no logs — invisible to the
      # binary-on-runner smoke. Fails the release before anything is pushed.
      - name: Image smoke test (boot container, create peer, assert QR)
        run: |
          set -euo pipefail
          # Deliberately do NOT override QUARKUS_DATASOURCE_JDBC_URL: this exercises
          # the image's own baked-in default DB path. A relative default (data/…)
          # resolves to a non-existent /data and dies at Flyway with SQLITE_CANTOPEN
          # (error 14) on a bare run — this catches that regression, which an
          # explicit override would mask.
          docker run -d --name islandr-smoke \
            -p 8081:8080 \
            -e ISLANDR_ADMIN_PASSWORD=ci-smoke-pw \
            -e QUARKUS_HTTP_HOST=0.0.0.0 \
            -v islandr-smoke-data:/var/lib/islandr \
            islandr:smoke
          trap 'docker rm -f islandr-smoke >/dev/null 2>&1 || true' EXIT

          # Wait until the image serves HTTP. Fail loudly if the container exits
          # (the exit-127 / wrong-base regression) instead of waiting the full loop.
          code=000
          for _ in $(seq 1 60); do
            running=$(docker inspect -f '{{.State.Running}}' islandr-smoke 2>/dev/null || echo false)
            if [ "$running" != "true" ]; then
              echo "::error::container exited before serving — base image cannot run the native binary"
              docker logs islandr-smoke || true
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/peers/next-ip || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          [ "$code" != "000" ] || { echo "::error::image did not serve HTTP"; docker logs islandr-smoke; exit 1; }

          login=$(curl -s -c /tmp/cj.txt -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8081/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-pw"}')
          [ "$login" = "200" ] || { echo "::error::admin login failed (HTTP $login)"; docker logs islandr-smoke; exit 1; }

          USER_ID=$(curl -s -b /tmp/cj.txt -X POST http://localhost:8081/api/v1/users \
            -H 'content-type: application/json' \
            -d '{"name":"Smoke","email":"smoke@example.com"}' | jq -r .id)
          IP=$(curl -s -b /tmp/cj.txt http://localhost:8081/api/v1/peers/next-ip | jq -r .assignedIp)
          [ -n "$USER_ID" ] && [ "$USER_ID" != "null" ] || { echo "::error::could not create user"; docker logs islandr-smoke; exit 1; }

          QR=$(curl -s -b /tmp/cj.txt -X POST "http://localhost:8081/api/v1/users/$USER_ID/peers" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"smoke-device\",\"assignedIp\":\"$IP\"}" | jq -r .qrPngBase64)
          [[ "$QR" == data:image/png* ]] || { echo "::error::QR generation failed on the image base (AWT/ImageIO/libz)"; docker logs islandr-smoke; exit 1; }
          echo "✓ image booted, login OK, peer + QR PNG OK"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Stage 5: E2E proxy enforcement (tags only, after release exists) ──────
  e2e-proxy:
    name: E2E — install-proxy.sh + real wg/nft enforcement
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install wireguard-tools + nftables
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools nftables

      # Undetermined statically whether ubuntu-latest's kernel has WireGuard
      # loadable — this is the first real-world check of that assumption.
      - name: Create a real wg0 interface
        run: |
          set -euo pipefail
          sudo modprobe wireguard
          sudo ip link add wg0 type wireguard
          # /etc/wireguard is the only directory wg may read a key from.
          # ubuntu-26.04 ships an enforcing AppArmor profile for /usr/bin/wg
          # whose single file rule is "file rw @{etc_rw}/wireguard/{,**}", and
          # it denies the binary dac_override and dac_read_search — so running
          # as root does not help, which is why /tmp, /var/tmp, RUNNER_TEMP and
          # /root were all refused with nothing but "fopen: Permission denied".
          # Measured on the image, not guessed. This is also the path the
          # Settings page tells operators to use, so CI now does what we
          # document.
          sudo install -d -m 0700 -o root -g root /etc/wireguard
          sudo sh -c 'umask 077; wg genkey > /etc/wireguard/wg0.key'
          sudo wg set wg0 private-key /etc/wireguard/wg0.key listen-port 51820
          sudo rm -f /etc/wireguard/wg0.key
          sudo ip addr add 10.8.0.1/24 dev wg0
          sudo ip link set wg0 up
          ip link show wg0

      # ISLANDR_PROXY_VERSION must be this exact tag — install-proxy.sh
      # defaults to the newest non-prerelease GitHub Release ("latest") when
      # unset, which for an RC tag would silently install the WRONG (older)
      # binary instead of the one release.yml just built for this tag.
      - name: Install islandr-proxy from this tag's just-published release
        run: |
          set -euo pipefail
          sudo ISLANDR_PROXY_VERSION="${{ github.ref_name }}" bash islandr-proxy/install-proxy.sh

      - name: Assert islandr-proxy.socket is active and listening
        run: |
          set -euo pipefail
          systemctl is-active islandr-proxy.socket
          systemctl status islandr-proxy.socket --no-pager
          # /run/islandr is 0700 islandr:islandr (tmpfiles.d entry in
          # install-proxy.sh) — the unprivileged runner user can't even
          # traverse into it to stat the socket, so this check needs sudo.
          sudo test -S /run/islandr/proxy.sock || { echo "::error::proxy.sock not present after install"; exit 1; }
          echo "✓ islandr-proxy.socket installed and listening"

      # The wrapper fetches the Gradle distribution from services.gradle.org on
      # any cache miss, and a miss is guaranteed on every release: Actions caches
      # are branch-scoped, so main cannot read the release branch's caches and its
      # own expired long ago (main is only pushed to at release time). A transient
      # reset on that download failed the 0.20.0 build on main while the tag build
      # of the identical commit succeeded. Fetch it once, with retries, before any
      # step depends on it.
      - name: Warm the Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "::warning::gradle distribution fetch failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::could not fetch the Gradle distribution after 3 attempts"
          exit 1

      - name: Build JVM application (fast-jar — nothing here needs native-image)
        run: ./gradlew quarkusBuild -x test --no-daemon

      # install-proxy.sh creates the islandr user with --home-dir /var/lib/islandr
      # but no -m flag, so the directory itself doesn't exist yet. The app writes
      # its nftables-ruleset staging file there (islandr.proxy.ruleset-path).
      #
      # The fast-jar is copied here (rather than run in place from
      # $GITHUB_WORKSPACE, chmod'd o+rX) because `sudo -u islandr` also needs
      # every *ancestor* directory of the jar to be traversable
      # (/home/runner/work/islandr/islandr/...), not just the jar's own
      # permissions -- chmod on the workspace alone doesn't reach those
      # ancestors. Copying into a directory already owned by islandr sidesteps
      # the whole ancestor-permission chain. (Found on the first two real
      # runs of this job, v0.16.0-rc.3/rc.4.)
      - name: Prepare /var/lib/islandr for the islandr user
        run: |
          set -euo pipefail
          sudo mkdir -p /var/lib/islandr
          sudo chown islandr:islandr /var/lib/islandr
          sudo cp -r build/quarkus-app /var/lib/islandr/quarkus-app
          sudo chown -R islandr:islandr /var/lib/islandr/quarkus-app

      # Boots the app as the islandr user (required: the proxy socket is 0600
      # islandr:islandr, zero group bits) in real socket-proxy mode, drives a
      # full site → resource → port → role → user → peer → grant → membership
      # flow through the REST API, then asserts the resulting WireGuard peer
      # and nftables accept rule actually exist on the host — i.e. that
      # App → islandr-proxy → sudo wg/nft really reaches the kernel, not a
      # mock. Everything lives in one step so the EXIT trap can clean up the
      # backgrounded app process (see Global Constraints: steps don't share a
      # shell, so a trap in an earlier step would never fire).
      - name: "E2E: boot app in socket mode, real ACL grant, assert wg/nft enforcement"
        run: |
          set -euo pipefail
          BASE=http://localhost:8083
          JAVA_BIN="$(command -v java)"

          sudo -u islandr env \
            ISLANDR_ADMIN_PASSWORD=ci-e2e-pw \
            QUARKUS_HTTP_PORT=8083 \
            QUARKUS_DATASOURCE_JDBC_URL="jdbc:sqlite:/tmp/islandr-e2e.db" \
            ISLANDR_WG_MODE=socket \
            ISLANDR_NFT_MODE=socket \
            "$JAVA_BIN" -jar /var/lib/islandr/quarkus-app/quarkus-run.jar \
            > /tmp/islandr-e2e.log 2>&1 &
          APP_PID=$!
          trap 'sudo kill "$APP_PID" 2>/dev/null || true' EXIT

          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v1/peers/next-ip" || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          [ "$code" != "000" ] || { echo "::error::app did not start"; cat /tmp/islandr-e2e.log; exit 1; }

          login=$(curl -s -c /tmp/cj.txt -o /dev/null -w '%{http_code}' \
            -X POST "$BASE/api/v1/auth/login" \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-e2e-pw"}')
          [ "$login" = "200" ] || { echo "::error::admin login failed (HTTP $login)"; cat /tmp/islandr-e2e.log; exit 1; }

          CJ="-b /tmp/cj.txt -c /tmp/cj.txt"

          SITE_ID=$(curl -s $CJ -X POST "$BASE/api/v1/sites" \
            -H 'content-type: application/json' \
            -d '{"name":"e2e-site","cidr":"10.20.0.0/24","description":"","gatewayPeerId":null,"dnsLabel":""}' | jq -r .id)
          [ -n "$SITE_ID" ] && [ "$SITE_ID" != "null" ] || { echo "::error::site creation failed"; cat /tmp/islandr-e2e.log; exit 1; }

          RESOURCE_ID=$(curl -s $CJ -X POST "$BASE/api/v1/sites/$SITE_ID/resources" \
            -H 'content-type: application/json' \
            -d '{"name":"e2e-target","ip":"10.20.0.50","description":"","type":"","dnsName":"","dnsFlat":false}' | jq -r .id)
          [ -n "$RESOURCE_ID" ] && [ "$RESOURCE_ID" != "null" ] || { echo "::error::resource creation failed"; cat /tmp/islandr-e2e.log; exit 1; }

          curl -s $CJ -X POST "$BASE/api/v1/resources/$RESOURCE_ID/ports" \
            -H 'content-type: application/json' \
            -d '{"port":3389,"portEnd":null,"transport":"tcp","protocol":"tcp","label":"","pathPrefix":"","rdpClipboard":false,"rdpFileTransfer":false,"rdpAccessMode":"native"}' > /dev/null

          ROLE_ID=$(curl -s $CJ -X POST "$BASE/api/v1/roles" \
            -H 'content-type: application/json' \
            -d '{"name":"e2e-role","description":""}' | jq -r .id)
          [ -n "$ROLE_ID" ] && [ "$ROLE_ID" != "null" ] || { echo "::error::role creation failed"; cat /tmp/islandr-e2e.log; exit 1; }

          USER_ID=$(curl -s $CJ -X POST "$BASE/api/v1/users" \
            -H 'content-type: application/json' \
            -d '{"name":"e2e-user","email":"e2e@example.com"}' | jq -r .id)
          [ -n "$USER_ID" ] && [ "$USER_ID" != "null" ] || { echo "::error::user creation failed"; cat /tmp/islandr-e2e.log; exit 1; }

          PEER_IP=$(curl -s $CJ "$BASE/api/v1/peers/next-ip" | jq -r .assignedIp)
          PEER=$(curl -s $CJ -X POST "$BASE/api/v1/users/$USER_ID/peers" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"e2e-peer\",\"assignedIp\":\"$PEER_IP\",\"assignedIpv6\":\"\",\"publicKey\":\"\",\"privateKey\":\"\",\"type\":\"client\"}")
          PEER_PUBKEY=$(echo "$PEER" | jq -r .peer.publicKey)
          [ -n "$PEER_PUBKEY" ] && [ "$PEER_PUBKEY" != "null" ] || { echo "::error::peer creation failed"; echo "$PEER"; cat /tmp/islandr-e2e.log; exit 1; }

          curl -s $CJ -X PUT "$BASE/api/v1/acl/matrix" \
            -H 'content-type: application/json' \
            -d "{\"grants\":[{\"roleId\":\"$ROLE_ID\",\"resourceId\":\"$RESOURCE_ID\",\"allPorts\":true,\"portIds\":[]}]}" > /dev/null

          curl -s $CJ -X PUT "$BASE/api/v1/roles/$ROLE_ID/users" \
            -H 'content-type: application/json' \
            -d "{\"userIds\":[\"$USER_ID\"]}" > /dev/null

          echo "→ Asserting real WireGuard peer config (App → islandr-proxy → wg)"
          sudo wg show wg0 | grep -F "$PEER_PUBKEY" \
            || { echo "::error::peer public key not found in 'wg show wg0' — proxy path did not reach the kernel"; sudo wg show wg0; cat /tmp/islandr-e2e.log; exit 1; }

          echo "→ Asserting real nftables accept rule (App → islandr-proxy → nft)"
          NFT_OUT=$(sudo nft list table inet islandr)
          echo "$NFT_OUT" | grep -F "ip saddr $PEER_IP" | grep -F "ip daddr 10.20.0.50" | grep -F "tcp dport 3389" | grep -q accept \
            || { echo "::error::expected accept rule not found in nftables ruleset"; echo "$NFT_OUT"; cat /tmp/islandr-e2e.log; exit 1; }

          echo "→ /etc/wireguard: islandr may pass through to its own directory, not list"
          GOT=$(sudo stat -c '%a %U %G' /etc/wireguard/islandr)
          [ "$GOT" = "2750 islandr root" ] \
            || { echo "::error::/etc/wireguard/islandr is '$GOT', want '2750 islandr root'"; exit 1; }
          sudo -u islandr test -w /etc/wireguard/islandr \
            || { echo "::error::islandr cannot write its own preshared-key directory"; sudo ls -ld /etc/wireguard /etc/wireguard/islandr; exit 1; }
          if sudo -u islandr ls /etc/wireguard >/dev/null 2>&1; then
            echo "::error::islandr can list /etc/wireguard — it should only pass through"; sudo ls -ld /etc/wireguard; exit 1
          fi
          # The point of setgid root: wg loses dac_override under AppArmor, so
          # root reads a key file only through group root.
          BORN=$(sudo -u islandr sh -c 'f=/etc/wireguard/islandr/psk-ci-probe; : > "$f"; stat -c %G "$f"; rm -f "$f"')
          [ "$BORN" = "root" ] \
            || { echo "::error::a file islandr creates there is in group '$BORN', want root — root's wg could not read it"; exit 1; }

          # A preshared key reaches wg only as a file, and on ubuntu-26.04 an
          # AppArmor profile lets wg read files only under /etc/wireguard. So
          # this is the check that the proxy writes it there — the plain peer
          # above never touches that path at all.
          echo "→ Asserting a peer with a preshared key reaches the interface (App → proxy → wg, AppArmor)"
          PSK_IP=$(curl -s $CJ "$BASE/api/v1/peers/next-ip" | jq -r .assignedIp)
          PSK_PEER=$(curl -s $CJ -X POST "$BASE/api/v1/users/$USER_ID/peers" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"e2e-psk-peer\",\"assignedIp\":\"$PSK_IP\",\"assignedIpv6\":\"\",\"publicKey\":\"\",\"privateKey\":\"\",\"type\":\"client\",\"generatePresharedKey\":true}")
          PSK_PUBKEY=$(echo "$PSK_PEER" | jq -r .peer.publicKey)
          [ -n "$PSK_PUBKEY" ] && [ "$PSK_PUBKEY" != "null" ] \
            || { echo "::error::a peer with a preshared key was refused"; echo "$PSK_PEER"; sudo journalctl -u islandr-proxy -n 40 --no-pager; cat /tmp/islandr-e2e.log; exit 1; }
          GOT_PSK=$(sudo wg show wg0 preshared-keys | awk -v k="$PSK_PUBKEY" '$1 == k { print $2 }')
          [ -n "$GOT_PSK" ] && [ "$GOT_PSK" != "(none)" ] \
            || { echo "::error::the interface carries no preshared key for that peer"; sudo wg show wg0 preshared-keys; exit 1; }

          echo "✓ install-proxy.sh + real App→islandr-proxy→wg/nft enforcement verified end-to-end"

  # ── Stage 6: E2E upgrade path (tags only, after release exists) ───────────
  #
  # The one thing a 1.0 promises is that upgrading stops being an event
  # (ADR-0033). Stage 5 proves a *fresh* install works. Nothing proved the way
  # from one release to the next, and nothing ever ran `update.sh --rollback` —
  # so the path that whole promise rests on would have executed for the first
  # time during a failed upgrade, which is the worst moment to find it broken.
  # Tracked as R-196.
  #
  # It is also the first time `setup-hub.sh` runs anywhere but on a human's VPS.
  e2e-upgrade:
    name: E2E — setup-hub.sh, update.sh and its rollback
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep off 80/443. The runner has them free, but a privileged bind adds a
      # failure mode that has nothing to do with what this job is testing.
      ISLANDR_HTTP_HOST: 127.0.0.1
      ISLANDR_HTTP_PORT: "8080"
      ISLANDR_HTTPS_PORT: "8443"
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools nftables sqlite3 jq

      # setup-hub.sh refuses without a configured interface — islandr manages
      # peers, not the interface itself (ADR-0030).
      - name: Create a real wg0 interface
        run: |
          set -euo pipefail
          sudo modprobe wireguard
          sudo ip link add wg0 type wireguard
          # /etc/wireguard is the only directory wg may read a key from.
          # ubuntu-26.04 ships an enforcing AppArmor profile for /usr/bin/wg
          # whose single file rule is "file rw @{etc_rw}/wireguard/{,**}", and
          # it denies the binary dac_override and dac_read_search — so running
          # as root does not help, which is why /tmp, /var/tmp, RUNNER_TEMP and
          # /root were all refused with nothing but "fopen: Permission denied".
          # Measured on the image, not guessed. This is also the path the
          # Settings page tells operators to use, so CI now does what we
          # document.
          sudo install -d -m 0700 -o root -g root /etc/wireguard
          sudo sh -c 'umask 077; wg genkey > /etc/wireguard/wg0.key'
          sudo wg set wg0 private-key /etc/wireguard/wg0.key listen-port 51820
          sudo rm -f /etc/wireguard/wg0.key
          sudo ip addr add 10.8.0.1/24 dev wg0
          sudo ip link set wg0 up

      # The release immediately before this tag — what a hub in the field is
      # running when this one appears. Drafts are skipped; release candidates
      # are not, because upgrading from an RC is a real case.
      - name: Determine the release to upgrade from
        id: prev
        run: |
          set -euo pipefail
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false) | .tag_name]
                  | map(select(. != "${{ github.ref_name }}")) | .[0] // ""')
          if [ -z "$PREV" ]; then
            echo "::notice::no earlier release exists — nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "upgrading from $PREV to ${{ github.ref_name }}"
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the previous release the way an admin does
        if: steps.prev.outputs.skip == 'false'
        run: |
          set -euo pipefail
          sudo -E ISLANDR_VERSION="${{ steps.prev.outputs.tag }}" \
               ISLANDR_SKIP_MEM_CHECK=1 \
               bash docs/install/setup-hub.sh

      # Everything below reads the version through the console API, because
      # that is what an operator looks at — not at the file on disk. The
      # credentials come out of /etc/default/islandr, which setup-hub.sh wrote.
      - name: Assert the previous release is up and serving
        if: steps.prev.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v1/version/check" || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          USER=$(sudo sed -n 's/^ISLANDR_ADMIN_USER=//p' /etc/default/islandr)
          PW=$(sudo sed -n 's/^ISLANDR_ADMIN_PASSWORD=//p' /etc/default/islandr)
          curl -sf -c /tmp/cj.txt -o /dev/null -X POST "$BASE/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg u "$USER" --arg p "$PW" '{username:$u,password:$p}')"
          GOT=$(curl -sf -b /tmp/cj.txt "$BASE/api/v1/settings" | jq -r .version)
          WANT="${{ steps.prev.outputs.tag }}"; WANT="${WANT#v}"
          echo "running $GOT, expected $WANT"
          [ "$GOT" = "$WANT" ] || { echo "::error::wrong version before the upgrade"; exit 1; }
          sudo sha256sum /etc/default/islandr | cut -d' ' -f1 > /tmp/conf.before
          sudo sqlite3 /var/lib/islandr/data/islandr.db \
            "CREATE TABLE e2e_marker (v TEXT); INSERT INTO e2e_marker VALUES ('before-upgrade');"

      # The runner image carries the AppArmor profile for wg, so update.sh's
      # preshared-key check really runs here — and on a hub this release's
      # setup-hub.sh installed it must find nothing to report. A note here
      # would mean every operator gets a false alarm on every update.
      - name: Upgrade to this tag
        if: steps.prev.outputs.skip == 'false'
        run: |
          set -euo pipefail
          sudo -E bash scripts/update.sh "${{ github.ref_name }}" | tee /tmp/update.out
          if grep -q "preshared key cannot be applied" /tmp/update.out; then
            echo "::error::update.sh reports a missing preshared-key setup on a hub setup-hub.sh just installed"; exit 1
          fi

      - name: Assert the new version is live and the configuration untouched
        if: steps.prev.outputs.skip == 'false'
        run: |
          set -euo pipefail
          systemctl is-active --quiet islandr || { sudo journalctl -u islandr -n 60 --no-pager; exit 1; }
          USER=$(sudo sed -n 's/^ISLANDR_ADMIN_USER=//p' /etc/default/islandr)
          PW=$(sudo sed -n 's/^ISLANDR_ADMIN_PASSWORD=//p' /etc/default/islandr)
          curl -sf -c /tmp/cj.txt -o /dev/null -X POST "$BASE/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg u "$USER" --arg p "$PW" '{username:$u,password:$p}')"
          GOT=$(curl -sf -b /tmp/cj.txt "$BASE/api/v1/settings" | jq -r .version)
          WANT="${{ github.ref_name }}"; WANT="${WANT#v}"
          [ "$GOT" = "$WANT" ] || { echo "::error::upgrade did not take: $GOT"; exit 1; }
          # An upgrade that rewrites the operator's configuration breaks the
          # promise instead of keeping it — ADR-0033 counts this file as covered.
          sudo sha256sum /etc/default/islandr | cut -d' ' -f1 > /tmp/conf.after
          diff /tmp/conf.before /tmp/conf.after \
            || { echo "::error::/etc/default/islandr was modified by the upgrade"; exit 1; }
          # Both backups have to exist, or the rollback below has nothing to
          # restore and would pass for the wrong reason.
          sudo test -f /opt/islandr/islandr.prev
          sudo test -f /var/lib/islandr/data/islandr.db.prev
          # Change the marker now, *after* the backup was taken. Without this
          # the value would read the same either way and the rollback check
          # below would pass whether or not the database was actually restored.
          sudo sqlite3 /var/lib/islandr/data/islandr.db \
            "UPDATE e2e_marker SET v = 'after-upgrade';"

      # The native half of the preshared-key check: RealWgAdapter under the
      # unit setup-hub.sh wrote, with ProtectSystem=strict making /etc read-only
      # except for what ReadWritePaths opens. Runs on the upgraded binary, so it
      # also proves that a hub set up by this release's script and then updated
      # can create such a peer on ubuntu-26.04.
      - name: Assert a peer with a preshared key reaches the interface (native)
        if: steps.prev.outputs.skip == 'false'
        run: |
          set -euo pipefail
          echo "→ /etc/wireguard: islandr may pass through to its own directory, not list"
          GOT=$(sudo stat -c '%a %U %G' /etc/wireguard/islandr)
          [ "$GOT" = "2750 islandr root" ] \
            || { echo "::error::/etc/wireguard/islandr is '$GOT', want '2750 islandr root'"; exit 1; }
          sudo -u islandr test -w /etc/wireguard/islandr \
            || { echo "::error::islandr cannot write its own preshared-key directory"; sudo ls -ld /etc/wireguard /etc/wireguard/islandr; exit 1; }
          if sudo -u islandr ls /etc/wireguard >/dev/null 2>&1; then
            echo "::error::islandr can list /etc/wireguard — it should only pass through"; sudo ls -ld /etc/wireguard; exit 1
          fi
          # The point of setgid root: wg loses dac_override under AppArmor, so
          # root reads a key file only through group root.
          BORN=$(sudo -u islandr sh -c 'f=/etc/wireguard/islandr/psk-ci-probe; : > "$f"; stat -c %G "$f"; rm -f "$f"')
          [ "$BORN" = "root" ] \
            || { echo "::error::a file islandr creates there is in group '$BORN', want root — root's wg could not read it"; exit 1; }
          ADMIN=$(sudo sed -n 's/^ISLANDR_ADMIN_USER=//p' /etc/default/islandr)
          PW=$(sudo sed -n 's/^ISLANDR_ADMIN_PASSWORD=//p' /etc/default/islandr)
          curl -sf -c /tmp/cj.txt -o /dev/null -X POST "$BASE/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg u "$ADMIN" --arg p "$PW" '{username:$u,password:$p}')"
          OWNER=$(curl -sf -b /tmp/cj.txt -X POST "$BASE/api/v1/users" \
            -H 'content-type: application/json' \
            -d '{"name":"e2e-psk-owner","email":"e2e-psk@example.com"}' | jq -r .id)
          PSK_IP=$(curl -sf -b /tmp/cj.txt "$BASE/api/v1/peers/next-ip" | jq -r .assignedIp)
          PSK_PEER=$(curl -s -b /tmp/cj.txt -X POST "$BASE/api/v1/users/$OWNER/peers" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"e2e-psk-peer\",\"assignedIp\":\"$PSK_IP\",\"assignedIpv6\":\"\",\"publicKey\":\"\",\"privateKey\":\"\",\"type\":\"client\",\"generatePresharedKey\":true}")
          PSK_PUBKEY=$(echo "$PSK_PEER" | jq -r .peer.publicKey)
          [ -n "$PSK_PUBKEY" ] && [ "$PSK_PUBKEY" != "null" ] \
            || { echo "::error::a peer with a preshared key was refused"; echo "$PSK_PEER"; sudo journalctl -u islandr -n 60 --no-pager; exit 1; }
          GOT_PSK=$(sudo wg show wg0 preshared-keys | awk -v k="$PSK_PUBKEY" '$1 == k { print $2 }')
          [ -n "$GOT_PSK" ] && [ "$GOT_PSK" != "(none)" ] \
            || { echo "::error::the interface carries no preshared key for that peer"; sudo wg show wg0 preshared-keys; exit 1; }
          echo "✓ preshared key applied on the native path"

      - name: Roll back, and assert both the binary and the database came back
        if: steps.prev.outputs.skip == 'false'
        run: |
          set -euo pipefail
          sudo -E bash scripts/update.sh --rollback
          systemctl is-active --quiet islandr || { sudo journalctl -u islandr -n 60 --no-pager; exit 1; }
          USER=$(sudo sed -n 's/^ISLANDR_ADMIN_USER=//p' /etc/default/islandr)
          PW=$(sudo sed -n 's/^ISLANDR_ADMIN_PASSWORD=//p' /etc/default/islandr)
          curl -sf -c /tmp/cj.txt -o /dev/null -X POST "$BASE/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg u "$USER" --arg p "$PW" '{username:$u,password:$p}')"
          GOT=$(curl -sf -b /tmp/cj.txt "$BASE/api/v1/settings" | jq -r .version)
          WANT="${{ steps.prev.outputs.tag }}"; WANT="${WANT#v}"
          [ "$GOT" = "$WANT" ] || { echo "::error::rollback left $GOT running"; exit 1; }
          # The database half is the one that is easy to get wrong and quiet
          # about it: migrations run at startup and there are no undo
          # migrations, so restoring only the binary leaves a schema it refuses.
          # The marker was changed after the backup was taken, so reading the
          # pre-upgrade value proves the file itself came back — not merely
          # that a table with that name still exists.
          MARK=$(sudo sqlite3 /var/lib/islandr/data/islandr.db \
            "SELECT v FROM e2e_marker;" 2>/dev/null || echo MISSING)
          [ "$MARK" = "before-upgrade" ] \
            || { echo "::error::database was not restored (marker: $MARK)"; exit 1; }
