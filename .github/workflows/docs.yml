name: Render Architecture Diagrams

on:
  push:
    branches: [main]
    paths:
      - architecture/workspace.dsl
      # Re-render when the workflow itself changes (e.g. the Graphviz install
      # fix) — otherwise a tooling fix never re-runs while workspace.dsl is
      # unchanged, leaving stale/broken diagrams committed.
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render C4 diagrams
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Export Structurizr DSL → PlantUML (C4)
        run: |
          mkdir -p architecture/diagrams
          # structurizr/structurizr is the successor to the deprecated structurizr/cli.
          # Mount point is /usr/local/structurizr; paths in -workspace/-output are relative to it.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$(pwd)/architecture:/usr/local/structurizr" \
            structurizr/structurizr export \
              -workspace workspace.dsl \
              -format plantuml/c4plantuml \
              -output diagrams
          echo "--- exported files ---"
          find architecture/ -type f | sort

      - name: Download PlantUML
        run: |
          curl -sL \
            "https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar" \
            -o plantuml.jar

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Render PlantUML → PNG
        run: |
          PUML_FILES=$(find architecture/diagrams -name "*.puml")
          if [ -z "$PUML_FILES" ]; then
            echo "No .puml files found — aborting."
            exit 1
          fi
          echo "Rendering: $PUML_FILES"
          java -jar plantuml.jar -tpng $PUML_FILES
          echo "--- rendered files ---"
          ls -la architecture/diagrams/

      - name: Commit rendered PNGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add architecture/diagrams/
          if git diff --staged --quiet; then
            echo "Diagrams unchanged — nothing to commit."
          else
            git commit -m "chore: regenerate C4 diagrams from workspace.dsl [skip ci]"
            git push
          fi
