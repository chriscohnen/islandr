# islandr — Docker Compose (0.11.0, Unix socket proxy — ADR-0012)
#
# This file runs the unprivileged islandr container. It boots in two stages:
#
#   1. Evaluation (default below): no proxy mounted. The full configuration
#      plane runs — GUI, peers, users, groups, ACLs, settings, audit, JSON
#      export/import — and persists to the data volume. Nothing is enforced on
#      the host kernel; the Admin Console shows a persistent "Socket-Proxy
#      nicht verfügbar" banner. This is the honest degraded mode, not the mock.
#
#   2. Enforcement (commented block): after running the host-side install.sh
#      (creates the `islandr` user, scoped sudoers, `wg0`, `islandr-proxy` +
#      systemd units), uncomment the socket mount and mode variables. islandr
#      connects to /run/islandr/proxy.sock, reconciles the pending config, and
#      starts pushing rules to `nft` and peers to `wg` — same image, no rebuild.
#
# The container never gets --cap-add, --network host, --privileged, or the
# Docker socket. All host privilege stays behind the proxy's JSON allowlist.
# See docs/adr/0012-docker-socket-proxy.md.

services:
  islandr:
    image: ghcr.io/chriscohnen/islandr:latest
    restart: unless-stopped

    # Host ports 80/443 map to the container's internal 8080/8443. Docker does
    # the privileged low-port bind on the host side, so the container itself
    # stays unprivileged — no capability needed. Port 80 must stay reachable
    # on the public interface for Let's Encrypt's HTTP-01 challenge (RFC 8555
    # always validates on port 80; this is not configurable, on either side).
    #
    # If a reverse proxy terminates TLS on the SAME host instead of islandr's
    # own built-in TLS/ACME, bind islandr to different host ports instead —
    # e.g. "127.0.0.1:7080:8080" and "127.0.0.1:7443:8443" — and point the
    # proxy at those. See ../reverse-proxy.md for both paths side by side.
    ports:
      - "80:8080"
      - "443:8443"

    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: "8080"
      # HTTPS listens alongside plain HTTP (ADR-0015); 8443 is the Quarkus
      # default and matches the container-side half of the 443 mapping above.
      QUARKUS_HTTP_SSL_PORT: "8443"

      # Local recovery admin. OIDC is the intended login (Settings → Identity);
      # the local admin exists for recovery. Leave the password empty to disable
      # local login entirely. Set it in a .env file next to this compose file
      # (see step below) — never commit it.
      ISLANDR_ADMIN_USER: admin
      ISLANDR_ADMIN_PASSWORD: "${ISLANDR_ADMIN_PASSWORD:-}"

      # SQLite lives on the data volume so config survives container restarts.
      # DB sits at the volume root (which always exists); the container image has
      # no /var/lib/islandr/data subdir, so pointing at data/ fails on a fresh
      # volume with SQLite error 14 (SQLITE_CANTOPEN). For a team-size Postgres
      # instead, set QUARKUS_DATASOURCE_DB_KIND=postgresql and the
      # QUARKUS_DATASOURCE_* / _DIALECT vars (see ../install.md).
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:sqlite:/var/lib/islandr/islandr.db

      # Encryption key for the `encrypted` private-key retention mode (ADR-0007).
      # Without it only `never` and `plaintext` retention are available. Generate
      # it into .env alongside ISLANDR_ADMIN_PASSWORD (see ../install.md, Docker
      # Compose section) so `encrypted` is selectable from the first start:
      #   echo "ISLANDR_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
      ISLANDR_ENCRYPTION_KEY: "${ISLANDR_ENCRYPTION_KEY:-}"

      # --- Enforcement (stage 2): uncomment once the host proxy is installed ---
      # ISLANDR_WG_MODE: socket
      # ISLANDR_NFT_MODE: socket
      # ISLANDR_PROXY_SOCKET: /run/islandr/proxy.sock

    volumes:
      # Config plane persistence (evaluation default). This is a named volume,
      # so it does NOT expose /var/lib/islandr on the host — fine while the proxy
      # is absent. For enforcement, replace it with the host bind mount below so
      # the proxy can read the ruleset islandr writes to /var/lib/islandr.
      - islandr-data:/var/lib/islandr

      # --- Enforcement (stage 2): uncomment, and comment out the named volume above ---
      # The proxy reads the ruleset from a path shared with the host, and islandr
      # talks to it over the socket. No capabilities are granted to the container.
      #
      # Switching from the named volume to this bind mount does NOT move your
      # existing config (peers/users/ACLs/audit) — it's a different storage
      # location, so the container starts fresh against an empty /var/lib/islandr
      # unless you back it up first. Easiest: in the Admin Console, Settings →
      # Config export/import → export a JSON snapshot before switching, then
      # import it once the container is back up on the new mount. Alternatively,
      # copy the raw volume contents across (also captures the SQLite DB itself):
      #   sudo mkdir -p /var/lib/islandr
      #   docker run --rm -v islandr-data:/from -v /var/lib/islandr:/to alpine \
      #     sh -c "cp -a /from/. /to/"
      # - /var/lib/islandr:/var/lib/islandr
      # - /run/islandr/proxy.sock:/run/islandr/proxy.sock

volumes:
  islandr-data:
